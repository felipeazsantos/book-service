server:
  port: 8100

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka

spring:
  application:
    name: book-service
  datasource:
    url: jdbc:mysql://localhost:3306/book?allowPublicKeyRetrieval=true&useSSL=false
    username: exchange
    password: exchange
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true